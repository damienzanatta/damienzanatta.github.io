<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redirection vers le portfolio numérique de Damien Zanatta.">
  <meta name="theme-color" content="#020813">
  <meta name="color-scheme" content="dark light">
  <title>Chargement | Damien Zanatta</title>

  <script>
    (function() {
      try {
        var storedTheme = localStorage.getItem('theme-preference');
        var systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = storedTheme || systemTheme || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var metaThemeColor = document.querySelector('meta[name="theme-color"]');
        if (metaThemeColor) metaThemeColor.setAttribute('content', theme === 'dark' ? '#020813' : '#f4f7fa');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://damienzanatta.github.io/">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="main-content" class="redirect-main">
    <div class="container redirect-content">
      <div class="site-title redirect-title">
        <a href="accueil.html" aria-label="Damien Zanatta - Accueil">Damien Zanatta</a>
      </div>

      <section class="loader-card" aria-labelledby="loading-title" aria-live="polite">
        <h1 id="loading-title">Chargement du portfolio...</h1>
        <div class="cyber-loader" aria-hidden="true"></div>
        <noscript>
          <p>La redirection automatique nécessite JavaScript. <a href="accueil.html">Accéder au portfolio</a>.</p>
        </noscript>
      </section>
    </div>
  </main>

  <script>
    window.setTimeout(function() { window.location.replace('accueil.html'); }, 1200);
  </script>
</body>
</html>
